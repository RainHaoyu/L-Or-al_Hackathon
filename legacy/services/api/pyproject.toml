[project]
name = "unbounded-api"
version = "0.1.0"
description = "无界体验家 · AI驱动的香水致敏原预警与香味可视化系统 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
